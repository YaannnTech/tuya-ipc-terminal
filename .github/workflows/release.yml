name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          CGO_ENABLED: "0"
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          for target in linux/amd64 linux/arm64 linux/arm \
            windows/amd64 windows/arm64 darwin/arm64 darwin/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = windows ]; then ext=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.VERSION=${version}" \
              -o "tuya-ipc-terminal-${goos}-${goarch}${ext}" .
          done
          sha256sum tuya-ipc-terminal-* > SHA256SUMS

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes: the "## [x.y.z]" section of CHANGELOG.md for this
          # tag (without its heading); generated notes if there is none.
          awk -v head="## [${TAG#v}]" '
            /^## \[/ { p = (index($0, head) == 1); next }
            /^\[[^]]+\]: / { p = 0 }
            p
          ' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" --verify-tag "${notes[@]}" --title "$TAG" \
            tuya-ipc-terminal-* SHA256SUMS
